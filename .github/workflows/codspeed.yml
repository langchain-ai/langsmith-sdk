name: CodSpeed

on:
  # Runs on main record the baseline that PR runs are compared against.
  push:
    branches: [main]
    paths:
      - "python/langsmith/**"
      - "python/bench/**"
  pull_request:
    paths:
      - "python/langsmith/**"
      - "python/bench/**"
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CPU simulation + memory. Runs everywhere; deterministic enough for hosted
  # runners because it models the CPU instead of timing it.
  benchmark:
    name: "Python Benchmarks"
    runs-on: ubuntu-latest
    # CPU simulation is far slower than a bare run, so the job timeout is what
    # bounds a hung benchmark (see --timeout=0 below).
    timeout-minutes: 30
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: 3.11
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --group bench

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation,memory
          working-directory: python
          # --timeout=0 drops the repo-wide 120s pytest-timeout, which is sized
          # for unit tests and kills benchmarks under CPU simulation.
          run: uv run pytest bench/test_bench.py --codspeed --timeout=0

  # Real elapsed time on CodSpeed's managed bare-metal ARM64 runners. Unlike
  # simulation this captures syscalls, I/O and real thread parallelism, which
  # matters for the create_*_run_trees cases (they drive tracing threads).
  #
  # `codspeed-macro` runners are registered by CodSpeed's GitHub App into the
  # org's `oss-runners` runner group, which already serves public repos:
  # langchain-ai/quickjs-rs runs walltime benchmarks on it from pull_request.
  # The group is not managed in langchain-ai/deployments, so its repository
  # access list is set in the org UI. If langsmith-sdk is not on that list this
  # job sits queued with no runner assigned instead of failing fast, since
  # queue wait is not bounded by timeout-minutes.
  benchmark-walltime:
    name: "Python Benchmarks (walltime)"
    runs-on: codspeed-macro
    timeout-minutes: 30
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cache-suffix for the ARM64 runners: setup-uv already embeds the
      # arch in its cache key, so x86 and ARM64 entries cannot collide.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: 3.11
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --group bench

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          working-directory: python
          run: uv run pytest bench/test_bench.py --codspeed --timeout=0
