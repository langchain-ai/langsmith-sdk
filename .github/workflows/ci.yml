name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      run-python-integration:
        description: "Run Python integration tests"
        default: "true"
        required: false
      run-js-integration:
        description: "Run JS integration tests"
        default: "true"
        required: false
      python-integration-environment:
        description: "Environment to run the Python integration tests and evals against"
        type: choice
        default: "beta"
        required: false
        options:
          - beta
          - v15-aks
          - v16-dual
          - v16-smithdb
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.x"

jobs:
  # ============================================================================
  # Path Detection
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            python:
              - 'python/**'
              - '.github/**'
            js:
              - 'js/**'
              - '.github/**'

  # ============================================================================
  # Python CI
  # ============================================================================
  python-lint:
    name: "Python Lint"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "python"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev --group lint
      - name: Check formatting
        run: uv run ruff format --check
      - name: Lint
        run: make lint

  python-test:
    name: "Python Test ${{ matrix.python-version }}"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --group dev --group lint
          uv pip install langchain
      - name: Build ${{ matrix.python-version }}
        run: uv build
      - name: Run Unit tests ${{ matrix.python-version }}
        run: make tests
        shell: bash

  python-wheel-test:
    name: "Python Wheel Test (strict deps)"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Check declared runtime deps are sufficient
        run: make test-wheel-imports

  # ============================================================================
  # JS CI
  # ============================================================================
  js-format:
    name: "JS Check formatting"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "js"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check

  js-lint:
    name: "JS Check linting"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "js"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check linting
        run: pnpm run lint

  js-build:
    name: "JS Build and check types"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "js"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and check types
        run: pnpm run build

  js-test:
    name: "JS Unit Tests (${{ matrix.os }}, ${{ matrix.node-version }})"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["22.x", "24.x"]
        include:
          - os: windows-latest
            node-version: 24.x
          - os: macos-latest
            node-version: 24.x
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: "js"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Check version
        run: pnpm run check-version
      - name: Test
        run: pnpm run test
      - name: Test Vitest
        run: pnpm run test:vitest

  # ============================================================================
  # JS Environment Tests
  # ============================================================================
  js-exports-esm:
    name: "JS Exports ESM"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: js
        run: pnpm build
      - name: Test ESM exports
        run: docker compose -f js/internal/environment_tests/docker-compose.yml run test-exports-esm

  js-exports-cjs:
    name: "JS Exports CJS"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: js
        run: pnpm build
      - name: Test CJS exports
        run: docker compose -f js/internal/environment_tests/docker-compose.yml run test-exports-cjs

  js-exports-cf:
    name: "JS Exports Cloudflare"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: js
        run: pnpm build
      - name: Test Cloudflare exports
        run: docker compose -f js/internal/environment_tests/docker-compose.yml run test-exports-cf

  js-exports-vite:
    name: "JS Exports Vite"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: js
        run: pnpm build
      - name: Test Vite exports
        run: docker compose -f js/internal/environment_tests/docker-compose.yml run test-exports-vite

  js-exports-webpack:
    name: "JS Exports Webpack"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: js
        run: pnpm build
      - name: Test Webpack exports
        run: docker compose -f js/internal/environment_tests/docker-compose.yml run test-exports-webpack

  js-exports-esbuild:
    name: "JS Exports esbuild"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: js
        run: pnpm build
      - name: Test esbuild exports
        run: docker compose -f js/internal/environment_tests/docker-compose.yml run test-exports-esbuild

  js-exports-metro:
    name: "JS Exports Metro"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: js
        run: pnpm build
      - name: Test Metro exports
        run: docker compose -f js/internal/environment_tests/docker-compose.yml run test-exports-metro

  js-deepagent-compat:
    name: "JS deepagent compat"
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: js
        run: pnpm build
      - name: Test deepagent compat
        run: docker compose -f js/internal/environment_tests/docker-compose.yml run test-deepagent-compat

  python-deepagent-compat:
    name: "Python deepagent compat"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"
      - name: Create venv and install local langsmith
        run: |
          uv venv
          uv pip install -e .
      - name: Install deepagents
        run: uv pip install deepagents
      - name: Run smoke test
        run: uv run python -m pytest tests/external/test_deepagent_compat.py -v --noconftest

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-changes:
    name: "Integration Test Changes"
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.check-changes.outputs.python_changed }}
      js_changed: ${{ steps.check-changes.outputs.js_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Check for file changes
        id: check-changes
        run: |
          if git diff --name-only origin/main HEAD | grep -E "^python/.*\.py$"; then
            echo "python_changed=true" >> $GITHUB_OUTPUT
          else
            echo "python_changed=false" >> $GITHUB_OUTPUT
          fi
          if git diff --name-only origin/main HEAD | grep -E "^js/.*\.(js|ts|jsx|tsx)$"; then
            echo "js_changed=true" >> $GITHUB_OUTPUT
          else
            echo "js_changed=false" >> $GITHUB_OUTPUT
          fi

  # Builds the python-integration matrix so a workflow_dispatch run can target
  # one (or all) of the LangSmith environments. Anything other than a dispatch
  # keeps the previous behavior: beta only.
  python-integration-matrix:
    name: "Python Integration Matrix"
    needs: integration-changes
    if: >
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'release') ||
        needs.integration-changes.outputs.python_changed == 'true'
      )) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run-python-integration == 'true')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: build-matrix
        env:
          SELECTED_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.python-integration-environment || 'beta' }}
        run: |
          python3 <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import os

          # Allowlist: anything unrecognized falls back to beta.
          ENDPOINTS = {
              "beta": "https://beta.api.smith.langchain.com",
              "v15-aks": "https://aks.smith.langchain.dev/api",
              "v16-dual": "https://stable-dual.eks.smith.langchain.dev/api",
              "v16-smithdb": "https://stable-smithdb.eks.smith.langchain.dev/api",
          }
          SHARD_TOTAL = 6

          selected = os.environ.get("SELECTED_ENVIRONMENT", "").strip()
          if selected == "all":
              environments = list(ENDPOINTS)
          elif selected in ENDPOINTS:
              environments = [selected]
          else:
              environments = ["beta"]

          include = []
          for environment in environments:
              base = {
                  "environment": environment,
                  "endpoint": ENDPOINTS[environment],
                  # Keep the beta job names untouched so required checks still match.
                  "name_suffix": "" if environment == "beta" else f" [{environment}]",
              }
              for shard_index in range(SHARD_TOTAL):
                  include.append(
                      {**base, "test-type": "integration", "shard_total": SHARD_TOTAL, "shard_index": shard_index}
                  )
              include.append({**base, "test-type": "evals", "shard_total": "", "shard_index": ""})
              # Doctests don't exercise the backend, so run them once against beta.
              if environment == "beta":
                  include.append({**base, "test-type": "doctest", "shard_total": "", "shard_index": ""})

          print("matrix=" + json.dumps({"include": include}))
          EOF

  python-integration:
    name: "Python ${{ matrix.test-type }} Test ${{ matrix.shard_index }}${{ matrix.name_suffix }}"
    needs: [integration-changes, python-integration-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python-integration-matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run Python ${{ matrix.test-type }}-${{ matrix.shard_index }}
        uses: ./.github/actions/python-integration-tests
        with:
          python-version: 3.11
          langsmith-endpoint: ${{ matrix.endpoint }}
          langsmith-api-key: >-
            ${{ (matrix.environment == 'v15-aks' && secrets.LANGSMITH_API_KEY_AKS_V15)
             || (matrix.environment == 'v16-dual' && secrets.LANGSMITH_API_KEY_STABLE_DUAL)
             || (matrix.environment == 'v16-smithdb' && secrets.LANGSMITH_API_KEY_STABLE_SMITHDB)
             || (matrix.environment == 'beta' && secrets.LANGSMITH_API_KEY_BETA)
             || '' }}
          langchain-api-key-prod: ${{ secrets.LANGSMITH_API_KEY_PROD }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          test-type: ${{ matrix.test-type }}
          shard-total: ${{ matrix.shard_total }}
          shard-index: ${{ matrix.shard_index }}

  js-integration:
    name: "JS Integration Test"
    needs: integration-changes
    if: >
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'release') ||
        needs.integration-changes.outputs.js_changed == 'true'
      )) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run-js-integration == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run JS integration tests
        uses: ./.github/actions/js-integration-tests
        with:
          node-version: 24.x
          langchain-api-key-beta: ${{ secrets.LANGSMITH_API_KEY_BETA }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  js-vitest-eval:
    name: "JS Vitest Runner Test"
    needs: integration-changes
    if: >
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'release') ||
        needs.integration-changes.outputs.js_changed == 'true'
      )) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run-js-integration == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run JS Vitest eval runner test
        uses: ./.github/actions/js-vitest-eval-test
        with:
          node-version: 24.x
          langchain-api-key-beta: ${{ secrets.LANGSMITH_API_KEY_BETA }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  bun-test:
    name: "Bun Integration Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "js"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run Bun tests
        run: bun test ./src/tests/bun/traceable.test.bun.ts
        env:
          LANGSMITH_TRACING: "true"
          LANGSMITH_ENDPOINT: https://beta.api.smith.langchain.com
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY_BETA }}

  # ============================================================================
  # CI Success Gate
  # ============================================================================
  ci-success:
    name: "CI Success"
    needs:
      - changes
      # Python
      - python-lint
      - python-test
      - python-wheel-test
      # JS
      - js-format
      - js-lint
      - js-build
      - js-test
      # JS Environment
      - js-exports-esm
      - js-exports-cjs
      - js-exports-cf
      - js-exports-vite
      - js-exports-webpack
      - js-exports-esbuild
      - js-exports-metro
      - js-deepagent-compat
      # Compatibility
      - python-deepagent-compat
      # Integration
      - integration-changes
      - python-integration
      - js-integration
      - js-vitest-eval
      - bun-test
    if: always()
    runs-on: ubuntu-latest
    env:
      JOBS_JSON: ${{ toJSON(needs) }}
      RESULTS_JSON: ${{ toJSON(needs.*.result) }}
    steps:
      - name: "CI Success"
        run: |
          echo "$JOBS_JSON"
          echo "$RESULTS_JSON"
          if echo "$RESULTS_JSON" | grep -qE '"(failure|cancelled)"'; then
            echo "CI failed - one or more jobs failed or were cancelled"
            exit 1
          fi
          echo "CI passed - all jobs succeeded or were skipped"
