name: "Python Integration Tests"
description: "Run integration tests"
inputs:
  python-version:
    description: "Python version"
    required: true
  langsmith-endpoint:
    description: "LangSmith API endpoint to run the tests against"
    required: false
    default: "https://beta.api.smith.langchain.com"
  langsmith-api-key:
    description: "LangSmith API key for langsmith-endpoint"
    required: true
  pytest-addopts:
    description: "Extra pytest options, e.g. -m 'not require_clickhouse' for SmithDB-only backends"
    required: false
    default: ""
  exit-first:
    description: "Stop at the first failure (-x). Set to false to report every failure in the shard."
    required: false
    default: "true"
  langchain-api-key-prod:
    description: "LangSmith Key"
    required: true
  openai-api-key:
    description: "OpenAI API key"
    required: false
  anthropic-api-key:
    description: "Anthropic API key"
    required: false
  gemini-api-key:
    description: "Gemini API key"
    required: false
  test-type:
    description: "Type of test to run (integration, doctest, evals, or all)"
    required: false
    default: "all"
  shard-total:
    description: "Total pytest shards (integration only)"
    required: false
    default: ""
  shard-index:
    description: "Current pytest shard index (integration only, 0-based)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Check LangSmith credentials
      env:
        LANGSMITH_ENDPOINT: ${{ inputs.langsmith-endpoint }}
        LANGSMITH_API_KEY: ${{ inputs.langsmith-api-key }}
      run: |
        if [ -z "$LANGSMITH_API_KEY" ]; then
          echo "::error::No API key configured for $LANGSMITH_ENDPOINT"
          exit 1
        fi
      shell: bash

    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        python-version: ${{ inputs.python-version }}
        working-directory: python
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --group dev
        uv pip install langchain langchain-openai langchain-anthropic tiktoken rapidfuzz vcrpy numpy
      shell: bash
      working-directory: python

    - name: Run integration tests
      if: inputs.test-type == 'integration' || inputs.test-type == 'all'
      env:
        LANGSMITH_TRACING_V2: "true"
        LANGSMITH_ENDPOINT: ${{ inputs.langsmith-endpoint }}
        LANGSMITH_API_KEY: ${{ inputs.langsmith-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GOOGLE_API_KEY: ${{ inputs.gemini-api-key }}
        LANGSMITH_TEST_CACHE: tests/cassettes
        PYTEST_ADDOPTS: ${{ inputs.pytest-addopts }}
        PYTEST_SHARD_TOTAL: ${{ inputs.shard-total }}
        PYTEST_SHARD_INDEX: ${{ inputs.shard-index }}
        # Empty drops -x so the shard reports every failure, not just the first.
        PYTEST_EXIT_FIRST: ${{ inputs.exit-first == 'true' && '-x' || '' }}
      run: make integration_tests_fast PYTEST_EXIT_FIRST="$PYTEST_EXIT_FIRST"
      shell: bash
      working-directory: python

    - name: Run Evaluation
      if: inputs.test-type == 'evals' || inputs.test-type == 'all'
      env:
          LANGSMITH_TRACING: "true"
          LANGSMITH_ENDPOINT: ${{ inputs.langsmith-endpoint }}
          LANGSMITH_API_KEY: ${{ inputs.langsmith-api-key }}
          OPENAI_API_KEY: ${{ inputs.openai-api-key }}
          ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
          GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
          GOOGLE_API_KEY: ${{ inputs.gemini-api-key }}
          LANGSMITH_TEST_CACHE: tests/cassettes
          PYTEST_ADDOPTS: ${{ inputs.pytest-addopts }}
          PYTEST_EXIT_FIRST: ${{ inputs.exit-first == 'true' && '-x' || '' }}
      run: make evals PYTEST_EXIT_FIRST="$PYTEST_EXIT_FIRST"
      shell: bash
      working-directory: python
