name: "JS Vitest Eval Runner"
description: "Run JS Vitest Eval Runner"
inputs:
  node-version:
    description: "Node version"
    required: true
  exit-first:
    description: "Stop at the first failing test (--bail=1). Defaults to off so a run reports every failure."
    required: false
    default: "false"
  langchain-api-key-beta:
    description: "Langchain"
    required: true
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: js/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: js

    - name: Run Vitest Eval Runner
      # VITEST_BAIL is either the literal --bail=1 or empty; unquoted so an empty
      # value drops the argument instead of passing vitest a blank filter.
      run: pnpm test:eval:vitest $VITEST_BAIL
      shell: bash
      working-directory: js
      env:
        VITEST_BAIL: ${{ inputs.exit-first == 'true' && '--bail=1' || '' }}
        LANGSMITH_TRACING_V2: "true"
        LANGSMITH_ENDPOINT: https://beta.api.smith.langchain.com
        LANGSMITH_API_KEY: ${{ inputs.langchain-api-key-beta }}
